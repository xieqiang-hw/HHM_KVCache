<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 756" width="960" height="756" role="img" aria-labelledby="title desc">
  <title id="title">KV 块复用分数的计算与阈值</title>
  <desc id="desc">上图用三次命中展示计分。下图横轴为时间，纵轴为复用分数。持续高频块达到 WIN 热准入门槛后保持较热，逐渐冷却块集中命中后停止复用，低频复用块达到 ASU 分数门槛但未达到 WIN 热准入门槛。曲线每次命中跳升 1 分，其余时间指数衰减。示例阈值分别为 0.5、1.0、1.8。假设逐渐冷却块在第 36 秒写完 WIN，最短驻留时间为 100 秒，到第 136 秒才满。该块在约第 91 秒已降至冷淘汰阈值。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="754" rx="18" fill="#f8fafc" stroke="#dbe4ee"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172b45">
    <text x="34" y="42" font-size="24" font-weight="bold">命中时间越近，贡献越大</text>
    <text x="34" y="72" font-size="16" fill="#52667d">示例：当前 t = 100 s，衰减时间常数 τ = 60 s</text>
    <line x1="89" y1="125" x2="892" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="892" y="108" text-anchor="end" font-size="15" fill="#52667d">时间</text>
    <g text-anchor="middle" font-size="16">
      <circle cx="140" cy="125" r="6" fill="#3b76b4"/>
      <text x="140" y="108">q = 40 s</text>
      <text x="140" y="153" fill="#52667d">距今 60 s</text>
      <text x="140" y="181" fill="#275986" font-weight="bold">e⁻¹ ≈ 0.37</text>
      <circle cx="470" cy="125" r="6" fill="#3b76b4"/>
      <text x="470" y="108">q = 70 s</text>
      <text x="470" y="153" fill="#52667d">距今 30 s</text>
      <text x="470" y="181" fill="#275986" font-weight="bold">exp(−0.5) ≈ 0.61</text>
      <circle cx="800" cy="125" r="7" fill="#245e9c"/>
      <text x="800" y="108">q = t = 100 s</text>
      <text x="800" y="153" fill="#52667d">距今 0 s</text>
      <text x="800" y="181" fill="#275986" font-weight="bold">e⁰ = 1.00</text>
    </g>
    <text x="480" y="217" text-anchor="middle" font-size="20" font-weight="bold">当前复用分数  s ≈ 1.97</text>
    <line x1="34" y1="236" x2="926" y2="236" stroke="#dbe4ee"/>
    <text x="34" y="269" font-size="22" font-weight="bold">三个节点的复用分数随时间变化</text>
    <text x="926" y="269" font-size="15" text-anchor="end" fill="#52667d">τ = 60 s，阈值仅用于示意</text>
    <g font-size="15">
      <path d="M80 356H800 M80 422H800 M260 316V554 M440 316V554 M620 316V554 M800 316V554"
            fill="none" stroke="#dbe4ee"/>
      <path d="M80 435.2H800 M80 488H800 M80 521H800" fill="none" stroke="#8490a5" stroke-width="1.4" stroke-dasharray="6 5"/>
      <path d="M80 316V554H800" fill="none" stroke="#64748b" stroke-width="1.6"/>
      <text x="80" y="302" fill="#52667d">复用分数</text>
      <g text-anchor="end" fill="#52667d">
        <text x="67" y="559">0</text><text x="67" y="493">1</text><text x="67" y="427">2</text><text x="67" y="361">3</text>
      </g>
      <g text-anchor="middle" fill="#52667d">
        <text x="80" y="578">0</text><text x="260" y="578">60</text><text x="440" y="578">120</text><text x="620" y="578">180</text><text x="800" y="578">240</text>
      </g>
      <text x="822" y="578" fill="#52667d">时间（秒）</text>
      <g font-size="14" fill="#52667d">
        <text x="813" y="440">θH = 1.8 热准入</text>
        <text x="813" y="493">θC = 1.0 冷淘汰</text>
        <text x="813" y="526">θA = 0.5 ASU 备份</text>
      </g>
      <g fill="none" stroke-linejoin="round">
        <path d="M80.0 554.0 L89.0 554.0 L95.0 554.0 V488.0 L104.0 491.2 L113.0 494.3 L122.0 497.2 L131.0 500.0 L140.0 502.6 L149.0 505.1 L155.0 506.7 V440.7 L164.0 446.2 L173.0 451.5 L182.0 456.5 L191.0 461.2 L200.0 465.8 L209.0 470.1 L215.0 472.8 V406.8 L224.0 414.0 L233.0 420.8 L242.0 427.3 L251.0 433.5 L260.0 439.4 L269.0 445.0 L275.0 448.5 V382.5 L284.0 390.9 L293.0 398.9 L302.0 406.4 L311.0 413.6 L320.0 420.5 L329.0 427.0 L335.0 431.1 V365.1 L344.0 374.4 L353.0 383.1 L362.0 391.5 L371.0 399.4 L380.0 406.9 L389.0 414.1 L395.0 418.7 V352.7 L404.0 362.5 L413.0 371.8 L422.0 380.7 L431.0 389.2 L440.0 397.2 L449.0 404.9 L455.0 409.7 V343.7 L464.0 354.0 L473.0 363.8 L482.0 373.0 L491.0 381.9 L500.0 390.3 L509.0 398.2 L515.0 403.3 V337.3 L524.0 347.9 L533.0 358.0 L542.0 367.5 L551.0 376.6 L560.0 385.3 L569.0 393.5 L575.0 398.8 V332.8 L584.0 343.6 L593.0 353.8 L602.0 363.6 L611.0 372.9 L620.0 381.7 L629.0 390.1 L635.0 395.5 V329.5 L644.0 340.4 L653.0 350.8 L662.0 360.8 L671.0 370.2 L680.0 379.1 L689.0 387.7 L695.0 393.1 V327.1 L704.0 338.2 L713.0 348.7 L722.0 358.7 L731.0 368.2 L740.0 377.3 L749.0 385.9 L755.0 391.4 V325.4 L764.0 336.6 L773.0 347.2 L782.0 357.3 L791.0 366.9 L800.0 376.0" stroke="#245e9c" stroke-width="3"/>
        <path d="M80.0 554.0 L89.0 554.0 L98.0 554.0 L107.0 554.0 L116.0 554.0 V488.0 L125.0 491.2 L134.0 494.3 L143.0 497.2 L152.0 500.0 V434.0 L161.0 439.8 L170.0 445.4 L179.0 450.7 L188.0 455.7 V389.7 L197.0 397.7 L206.0 405.4 L215.0 412.6 L224.0 419.5 L233.0 426.1 L242.0 432.3 L251.0 438.2 L260.0 443.9 L269.0 449.3 L278.0 454.4 L287.0 459.2 L296.0 463.8 L305.0 468.2 L314.0 472.4 L323.0 476.4 L332.0 480.2 L341.0 483.8 L350.0 487.2 L359.0 490.5 L368.0 493.6 L377.0 496.5 L386.0 499.3 L395.0 502.0 L404.0 504.5 L413.0 506.9 L422.0 509.2 L431.0 511.4 L440.0 513.5 L449.0 515.5 L458.0 517.3 L467.0 519.1 L476.0 520.8 L485.0 522.5 L494.0 524.0 L503.0 525.5 L512.0 526.8 L521.0 528.2 L530.0 529.4 L539.0 530.6 L548.0 531.8 L557.0 532.9 L566.0 533.9 L575.0 534.9 L584.0 535.8 L593.0 536.7 L602.0 537.5 L611.0 538.3 L620.0 539.1 L629.0 539.8 L638.0 540.5 L647.0 541.2 L656.0 541.8 L665.0 542.4 L674.0 543.0 L683.0 543.5 L692.0 544.0 L701.0 544.5 L710.0 545.0 L719.0 545.4 L728.0 545.8 L737.0 546.2 L746.0 546.6 L755.0 547.0 L764.0 547.3 L773.0 547.6 L782.0 547.9 L791.0 548.2 L800.0 548.5" stroke="#9c4b2c" stroke-width="3" stroke-dasharray="9 4"/>
        <path d="M80.0 554.0 L89.0 554.0 L98.0 554.0 L107.0 554.0 L116.0 554.0 L125.0 554.0 L134.0 554.0 L143.0 554.0 L152.0 554.0 L161.0 554.0 L170.0 554.0 L179.0 554.0 L188.0 554.0 L197.0 554.0 L200.0 554.0 V488.0 L209.0 491.2 L218.0 494.3 L227.0 497.2 L236.0 500.0 L245.0 502.6 L254.0 505.1 L263.0 507.5 L272.0 509.8 L281.0 511.9 L290.0 514.0 L299.0 515.9 L308.0 517.8 L317.0 519.5 L326.0 521.2 L335.0 522.8 L344.0 524.3 L353.0 525.8 L362.0 527.2 L371.0 528.5 L380.0 529.7 L389.0 530.9 L398.0 532.0 L407.0 533.1 L416.0 534.1 L425.0 535.1 L434.0 536.0 L440.0 536.6 V470.6 L449.0 474.7 L458.0 478.5 L467.0 482.2 L476.0 485.7 L485.0 489.1 L494.0 492.2 L503.0 495.2 L512.0 498.1 L521.0 500.8 L530.0 503.4 L539.0 505.9 L548.0 508.2 L557.0 510.5 L566.0 512.6 L575.0 514.6 L584.0 516.5 L593.0 518.4 L602.0 520.1 L611.0 521.7 L620.0 523.3 L629.0 524.8 L638.0 526.2 L647.0 527.6 L656.0 528.9 L665.0 530.1 L674.0 531.3 L683.0 532.4 L692.0 533.4 L701.0 534.4 L710.0 535.4 L719.0 536.3 L728.0 537.2 L737.0 538.0 L740.0 538.2 V472.2 L749.0 476.2 L758.0 480.0 L767.0 483.6 L776.0 487.1 L785.0 490.3 L794.0 493.4 L800.0 495.4" stroke="#267566" stroke-width="3" stroke-dasharray="2 4" stroke-linecap="round"/>
      </g>
      <circle cx="352.2" cy="488" r="5" fill="#f8fafc" stroke="#9c4b2c" stroke-width="2.5"/>
      <text x="368" y="478" fill="#9c4b2c" font-size="14">降至冷淘汰门槛（约 91 s）</text>
      <g fill="#9c4b2c" text-anchor="middle" font-size="14">
        <text x="188" y="611">36 s 写完 WIN</text>
        <text x="488" y="611">136 s 驻留期满</text>
        <path d="M188 619v14 M188 626H488 M488 619v14" fill="none" stroke="#9c4b2c" stroke-width="1.8"/>
        <text x="338" y="652" font-size="16" font-weight="bold">逐渐冷却块的最短驻留时间 T<tspan baseline-shift="sub" font-size="11">H</tspan> = 100 s（示例）</text>
      </g>
      <path d="M39 687h32" stroke="#245e9c" stroke-width="3"/>
      <text x="80" y="692">持续高频块</text>
      <path d="M286 687h32" stroke="#9c4b2c" stroke-width="3" stroke-dasharray="9 4"/>
      <text x="327" y="692">逐渐冷却块</text>
      <path d="M553 687h32" stroke="#267566" stroke-width="3" stroke-dasharray="2 4" stroke-linecap="round"/>
      <text x="594" y="692">低频复用块</text>
      <text x="39" y="728" fill="#52667d">逐渐冷却块先达到冷淘汰分数门槛，驻留期满且源块未被占用后才可淘汰。</text>
    </g>
  </g>
</svg>
